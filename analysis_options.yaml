include: lint_options.yaml

analyzer:
  exclude:
    - build/**
    - core/**
    - services/**
    - dist/**
    - concord/**
    - lib/l10n/**
    - lib/**/generated/**
    - plugins/**
    - third_party/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore
