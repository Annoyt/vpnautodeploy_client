name: neko-release

# NekoVPN release builds (docs/PLAN.md, section 5). Upstream's build.yaml keeps
# running its checks here but publishes only from chen08209/FlClash; this one
# builds our signed Android APKs. A v*-neko.* tag puts them into a DRAFT
# release, so nothing is public until the owner publishes it; a run by hand
# only leaves them as a run artifact.

on:
  push:
    tags:
      - 'v*-neko.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# Flutter, Go, the NDK and the CA bundle are not pinned here: the first step
# reads upstream's build.yaml, so the core is always built with the
# toolchain upstream tested it with, and an upstream merge moves both.
env:
  PACKAGE: com.nekovpn.client
  # Not a secret: as one, GitHub would mask the word in every log line.
  KEY_ALIAS: nekovpn
  # SHA-256 of the release certificate: an APK signed by anything else
  # (a debug key when the secrets are missing) fails the build.
  CERT_SHA256: d1acb8bff015e22d3c02403d3309ebfe4b84258965df316269ebfddad3aeab85

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, pubspec.yaml says v$version" >&2
            exit 1
          fi

      # A build on an old base would ship a core and dependencies upstream
      # has already moved past: merge upstream first (docs/PLAN.md, section
      # 7). The repository variable NEKO_ALLOW_OLD_UPSTREAM=1 lets one urgent
      # build through; delete it afterwards.
      - name: Based on the latest upstream release
        if: vars.NEKO_ALLOW_OLD_UPSTREAM != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=0
          versions="$(bash tool/neko/upstream_base.sh)" || code=$?
          read -r base latest <<< "$versions"
          case "$code" in
            0) echo "based on v$base, upstream's latest release is v$latest" ;;
            10)
              echo "upstream released v$latest, this build is based on v$base:" >&2
              echo "merge upstream first (docs/PLAN.md, section 7)" >&2
              exit 1
              ;;
            *) exit 1 ;;
          esac

      - name: Toolchain from upstream's build.yaml
        run: |
          pin() {
            value="$(yq -e "$2" .github/workflows/build.yaml)" || {
              echo "build.yaml has no $1 at $2" >&2
              exit 1
            }
            echo "$1=$value" | tee -a "$GITHUB_ENV"
          }
          ca='.jobs.build.steps[] | select(.name == "Fetch CA certificates")'
          pin FLUTTER_VERSION '.env.FLUTTER_VERSION'
          pin GO_VERSION '.env.GO_VERSION'
          pin NDK_VERSION '.env.NDK_VERSION'
          pin CA_BUNDLE "$ca | .env.CA_BUNDLE"
          pin CA_BUNDLE_SHA256 "$ca | .env.CA_BUNDLE_SHA256"

      - name: Setup signing
        env:
          KEYSTORE: ${{ secrets.NEKO_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.NEKO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NEKO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo 'NEKO_KEYSTORE is not set; the build would be a debug-signed .dev app' >&2
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No caches, as in upstream's release build (.agents/commands.md, "CI
      # Caches"): a tag run starts cold, and its entries would only evict
      # the ones branch runs read.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Install dependencies
        run: |
          flutter --version
          flutter pub get

      # Upstream's step, word for word (test/neko/release_workflow_test.dart):
      # the core embeds this bundle, and the app trusts it for downloads.
      - name: Fetch CA certificates
        shell: bash
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android -v

      - name: Collect and check the APKs
        run: |
          mkdir -p release
          find dist -type f -name '*.apk' -exec cp {} release/ \;
          ls -la release
          count="$(find release -name '*.apk' | wc -l)"
          [ "$count" -eq 3 ] || { echo "expected 3 APKs (one per ABI), got $count" >&2; exit 1; }
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          for apk in release/*.apk; do
            pkg="$("$bt/aapt2" dump packagename "$apk")"
            [ "$pkg" = "$PACKAGE" ] || { echo "$apk: package $pkg" >&2; exit 1; }
            "$bt/aapt2" dump badging "$apk" | grep -E '^(package|application-label):'
            # The label before "certificate" varies by apksigner version
            # ("Signer #1", "V2 Signer:"); the digest line does not.
            certs="$("$bt/apksigner" verify --print-certs "$apk")"
            echo "$certs" | grep -E 'certificate (DN|SHA-256 digest):'
            cert="$(echo "$certs" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)"
            [ "$cert" = "$CERT_SHA256" ] || { echo "$apk: signed by $cert" >&2; exit 1; }
            # What the fork removed must stay out. firebase-components and
            # -encoders remain on purpose: Google ML Kit (mobile_scanner, the
            # QR scanner) runs on them; they are listed, not failed.
            if unzip -l "$apk" | grep -i -E 'crashlytics|firebase-analytics|measurement'; then
              echo "$apk carries Firebase Crashlytics or Analytics" >&2
              exit 1
            fi
            unzip -l "$apk" | grep -i -E 'firebase|mlkit|datatransport' || true
          done
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekovpn-android
          path: release/
          retention-days: 30

      # The update dialog lists the items between the changelog markers, so
      # the notes come from CHANGELOG-NEKO.md; no section for the version,
      # no release.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo 'Тестовая сборка NekoVPN для Android, изменённой версии FlClash.'
            echo
            echo 'Что нового:'
            echo
            dart run tool/neko/release_notes.dart "$version"
            echo
            echo "Все изменения форка: [CHANGELOG-NEKO.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG-NEKO.md)."
            echo
            echo 'Какой файл ставить: `arm64-v8a` подходит почти всем телефонам последних лет,'
            echo '`armeabi-v7a` старым 32-битным, `x86_64` эмуляторам и редким планшетам.'
            echo 'Ставится рядом с FlClash и Hiddify, не заменяя их.'
            echo
            echo "Контрольные суммы в \`SHA256SUMS\`, сертификат подписи SHA-256: \`$CERT_SHA256\`."
          } > release-notes.md
          cat release-notes.md

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          name: NekoVPN ${{ github.ref_name }} (тестовая сборка)
          files: release/*
          body_path: release-notes.md
